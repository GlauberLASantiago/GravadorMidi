<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <style>
        /* * PALETA DE CORES:
         * Verde Claro: #BCDFB9
         * Rosa/Salmão: #C87F8B
         * Pêssego:     #E9A97F
         * Amarelo Pálido:#E7F0C7
         * Preto:       #000000
         * Branco:      #FFFFFF
         */

        body { 
            background-color: #E7F0C7;
            color: #000000; 
            user-select: none;
            overflow-x: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Estilo Neo-Brutalista para containers */
        .brutal-box {
            background-color: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.2s ease;
        }

        /* Estilização do container do piano */
        .piano-container {
            display: flex;
            background: #BCDFB9;
            padding: 24px 24px 0 24px;
            border-radius: 16px;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #000000 #E7F0C7;
        }

        .piano-container::-webkit-scrollbar { height: 16px; border-top: 4px solid #000000; }
        .piano-container::-webkit-scrollbar-track { background: #E7F0C7; border-radius: 0 0 12px 12px; }
        .piano-container::-webkit-scrollbar-thumb { background: #000000; border-radius: 8px; border: 3px solid #E7F0C7; }

        /* Teclas Brancas */
        .white {
            width: 54px; 
            height: 240px; 
            background: #FFFFFF;
            border: 3px solid #000000; 
            border-top: none;
            border-radius: 0 0 8px 8px;
            cursor: pointer; 
            position: relative; 
            z-index: 1;
            box-shadow: 0 6px 0px rgba(0,0,0,0.1);
            transition: background 0.05s ease, transform 0.05s ease, box-shadow 0.05s ease;
        }
        .white.active {
            background: #E9A97F; 
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.1);
        }

        /* Teclas Pretas */
        .black {
            width: 34px; 
            height: 150px;
            background: #000000;
            border: 2px solid #000000;
            border-radius: 0 0 6px 6px; 
            cursor: pointer;
            z-index: 10; 
            transition: background 0.05s ease, transform 0.05s ease;
            position: absolute; 
            top: 0; 
            right: -17px; 
        }
        .black.active {
            background: #C87F8B; 
            border-color: #000000;
            transform: translateY(4px);
        }

        /* Elementos de Formulário UI */
        select, button {
            border: 2px solid #000000;
            color: #000000; 
            font-weight: 700;
            transition: all 0.1s ease;
        }
        select { background-color: #FFFFFF; }
        select:focus { outline: none; box-shadow: 4px 4px 0px #C87F8B; }
        
        button { box-shadow: 2px 2px 0px #000000; }
        button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #000000; }
        button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000000; }
        button:disabled { opacity: 0.5; pointer-events: none; box-shadow: 0px 0px 0px #000000; transform: translate(2px, 2px); }
        
        .title-shadow { text-shadow: 2px 2px 0px #000000; }
        
        /* Ocultar setas do input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>

        ];

        const sfNames = [
            "acoustic_grand_piano", "bright_acoustic_piano", "electric_grand_piano", "honkytonk_piano", "electric_piano_1", "electric_piano_2", "harpsichord", "clavi",
            "celesta", "glockenspiel", "music_box", "vibraphone", "marimba", "xylophone", "tubular_bells", "dulcimer",
            "drawbar_organ", "percussive_organ", "rock_organ", "church_organ", "reed_organ", "accordion", "harmonica", "tango_accordion",
            "acoustic_guitar_nylon", "acoustic_guitar_steel", "electric_guitar_jazz", "electric_guitar_clean", "electric_guitar_muted", "overdriven_guitar", "distortion_guitar", "guitar_harmonics",

            "violin", "viola", "cello", "contrabass", "tremolo_strings", "pizzicato_strings", "orchestral_harp", "timpani",
            "string_ensemble_1", "string_ensemble_2", "synthstrings_1", "synthstrings_2", "choir_aahs", "voice_oohs", "synth_voice", "orchestral_hit",
            "trumpet", "trombone", "tuba", "muted_trumpet", "french_horn", "brass_section", "synthbrass_1", "synthbrass_2",
            "soprano_sax", "alto_sax", "tenor_sax", "baritone_sax", "oboe", "english_horn", "bassoon", "clarinet",
            "piccolo", "flute", "recorder", "pan_flute", "blown_bottle", "shakuhachi", "whistle", "ocarina",
            "lead_1_square", "lead_2_sawtooth", "lead_3_calliope", "lead_4_chiff", "lead_5_charang", "lead_6_voice", "lead_7_fifths", "lead_8_bass_lead",
            "pad_1_new_age", "pad_2_warm", "pad_3_polysynth", "pad_4_choir", "pad_5_bowed", "pad_6_metallic", "pad_7_halo", "pad_8_sweep",
            "fx_1_rain", "fx_2_soundtrack", "fx_3_crystal", "fx_4_atmosphere", "fx_5_brightness", "fx_6_goblins", "fx_7_echoes", "fx_8_scifi"
        ];

        // --- SISTEMA DE GRAVAÇÃO, METRÔNOMO E QUANTIZAÇÃO ---
        let isRecording = false;
        let isPlaying = false;
        let recordStartTime = 0;
        let recordedNotes = []; 
        let activeRecordingNotes = {}; 
        let playbackTimers = []; 

        // Variáveis do Metrônomo
        let isMetronomeOn = true;
        let bpm = 120;
        let timeSignature = [4, 4];
        let nextClickTime = 0;
        let currentBeat = 0;
        let metronomeTimer = null;

        const btnRecord = document.getElementById('btn-record');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const btnClear = document.getElementById('btn-clear');
        const btnExport = document.getElementById('btn-export');
        const exportTextEl = document.getElementById('export-text');
        const noteCountEl = document.getElementById('note-count');
        const quantizeSelect = document.getElementById('quantize-select');

        // Função para atualizar o visual da Quantização conforme o Compasso
        function updateQuantizeOptions() {
            const isCompound = (timeSignature[0] === 6 && timeSignature[1] === 8);
            const currentValue = quantizeSelect.value;
            
            // Limpa opções atuais
            quantizeSelect.innerHTML = '';
            
            const options = [];
            if (isCompound) {
                options.push({ val: '0', text: '—' });
                options.push({ val: '1', text: '♩.' });
                options.push({ val: '0.3333333333', text: '♪' });
                options.push({ val: '0.1666666667', text: '♬' });
            } else {
                options.push({ val: '0', text: '—' });
                options.push({ val: '1', text: '♩' });
                options.push({ val: '0.5', text: '♪' });
                options.push({ val: '0.3333333333', text: '³♪' });
                options.push({ val: '0.25', text: '♬' });
            }

            // Injeta as novas opções
            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.val;
                el.textContent = opt.text;
                quantizeSelect.appendChild(el);
            });

            // Tenta manter a opção selecionada anteriormente se ela existir no novo menu, senão zera
            if (Array.from(quantizeSelect.options).some(opt => opt.value === currentValue)) {
                quantizeSelect.value = currentValue;
            } else {
                quantizeSelect.value = '0';
            }
        }

        // Atualização de Estados via UI
        document.getElementById('metronome-toggle').addEventListener('change', (e) => isMetronomeOn = e.target.checked);
        document.getElementById('bpm-input').addEventListener('change', (e) => bpm = parseInt(e.target.value) || 120);
        document.getElementById('time-sig-select').addEventListener('change', (e) => {
            const parts = e.target.value.split('/');
            timeSignature = [parseInt(parts[0]), parseInt(parts[1])];
            updateQuantizeOptions(); // Troca as figuras musicais no menu ao alterar o compasso
        });

        // Inicializa o menu de quantização logo na abertura do site
        updateQuantizeOptions();

        // --- LÓGICA DE QUANTIZAÇÃO ---
        function quantizeTime(timeInSeconds, currentBpm, quantizeFraction) {
            if (quantizeFraction === 0) return timeInSeconds;
            
            // "currentBpm" representa a unidade de tempo. Em compasso composto (6/8), é a semínima pontuada.
            const secondsPerBeat = 60.0 / currentBpm;
            const beats = timeInSeconds / secondsPerBeat;
            // Arredonda o tempo gravado para a fração de batida mais próxima
            const quantizedBeats = Math.round(beats / quantizeFraction) * quantizeFraction;
            
            return Math.max(0, quantizedBeats * secondsPerBeat);
        }

        // Recupera as notas aplicando a quantização selecionada no menu
        function getQuantizedNotes() {
            const qValue = parseFloat(document.getElementById('quantize-select').value);
            
            if (qValue === 0) return recordedNotes; // Sem quantização

            return recordedNotes.map(n => {
                if (n.isMetronome) return n; // Nunca quantiza os cliques perfeitos do metrônomo
                
                const qStart = quantizeTime(n.start, bpm, qValue);
                return { ...n, start: qStart };
            });
        }

        // Áudio do Beep do Metrônomo
        function playClickAudio(time, isAccent) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.value = isAccent ? 1200 : 800;
            osc.type = 'sine';
            
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.5, time + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            
            osc.start(time);
            osc.stop(time + 0.1);
        }

        // Agendador do Metrônomo para Gravação
        function scheduleMetronome() {
            if (!isRecording) return;
            const lookahead = 0.1; // Olha 100ms para o futuro para agendar sem atraso
            
            // Verifica se é compasso composto (ex: 6/8)
            const isCompound = (timeSignature[0] === 6 && timeSignature[1] === 8);
            
            // Se for 6/8, o metrônomo bate 6 vezes por compasso (nas colcheias). Senão, bate o valor normal.
            const beatsPerMeasure = isCompound ? 6 : timeSignature[0];
            
            // O intervalo de clique: Em 6/8, o BPM é a semínima pontuada. Logo dividimos por 3 para obter o tempo da colcheia.
            const clickInterval = isCompound ? (60.0 / bpm) / 3 : (60.0 / bpm);
            
            while (nextClickTime < audioCtx.currentTime + lookahead) {
                let velocity = 80;
                
                if (currentBeat === 0) {
                    velocity = 100; // Forte no tempo 1
                } else if (isCompound && currentBeat === 3) {
                    velocity = 90; // Acento secundário no compasso composto (tempo 4 - colcheia do meio)
                }
                
                // Toca o bip de áudio
                playClickAudio(nextClickTime, velocity >= 90);
                
                // Salva o clique na pista
                recordedNotes.push({
                    pitch: 37, // C#2 (Side Stick / Aro)
                    start: nextClickTime - recordStartTime,
                    duration: 0.1,
                    velocity: velocity,
                    channel: 10,
                    program: 0,
                    isMetronome: true
                });

                // Avança para o próximo tempo
                nextClickTime += clickInterval;
                currentBeat++;
                if (currentBeat >= beatsPerMeasure) {
                    currentBeat = 0;
                }
            }
            metronomeTimer = setTimeout(scheduleMetronome, 25);
            updateRecorderUI(); // Atualiza contador de notas
        }

        function updateRecorderUI() {
            // Oculta notas do metrônomo do contador visual pra não confundir o usuário
            const melodicNotesCount = recordedNotes.filter(n => !n.isMetronome).length;
            noteCountEl.textContent = melodicNotesCount;
            
            btnPlay.disabled = recordedNotes.length === 0 || isRecording;
            btnExport.disabled = melodicNotesCount === 0 || isRecording;
            btnStop.disabled = !isRecording && !isPlaying;
            
            if (isRecording) {
                btnRecord.style.backgroundColor = '#C87F8B';
                btnRecord.style.color = '#FFFFFF';
                document.querySelector('.record-dot').classList.add('animate-ping');
                document.getElementById('record-text').textContent = 'Gravando...';
            } else {
                btnRecord.style.backgroundColor = '#FFFFFF';
                btnRecord.style.color = '#C87F8B';
                document.querySelector('.record-dot').classList.remove('animate-ping');
                document.getElementById('record-text').textContent = 'Gravar';
            }
        }

        btnRecord.addEventListener('click', async () => {
            if (isPlaying) stopPlayback();
            isRecording = !isRecording;
            
            if (isRecording) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume(); // Aguarda o áudio iniciar para o tempo não ficar dessincronizado
                }
                
                // O tempo zero da gravação será o instante exato em que o contexto de áudio estiver pronto
                recordStartTime = audioCtx.currentTime;
                
                if (isMetronomeOn) {
                    nextClickTime = recordStartTime;
                    currentBeat = 0;
                    scheduleMetronome();
                }
            } else {
                // Parar gravação
                clearTimeout(metronomeTimer);
                const now = audioCtx.currentTime;
                for (const note in activeRecordingNotes) {
                    let rNote = activeRecordingNotes[note];
                    rNote.duration = now - recordStartTime - rNote.start;
                    recordedNotes.push(rNote);
                }
                activeRecordingNotes = {};
            }
            updateRecorderUI();
        });

        btnClear.addEventListener('click', () => {
            if (isRecording) btnRecord.click(); 
            if (isPlaying) stopPlayback();
            recordedNotes = [];
            activeRecordingNotes = {};
            updateRecorderUI();
        });

        btnPlay.addEventListener('click', () => {
            if (recordedNotes.length === 0 || isRecording || isPlaying) return;
            isPlaying = true;
            updateRecorderUI();
            
            // Busca as notas já processadas pela quantização escolhida na interface
            const notesToPlay = getQuantizedNotes();
            let maxDuration = 0;

            notesToPlay.forEach(n => {
                const playTime = n.start;
                const endTime = n.start + n.duration;
                if (endTime > maxDuration) maxDuration = endTime;

                let t1 = setTimeout(() => {
                    if (n.isMetronome) {
                        // Toca o clique do metrônomo gravado apenas se ele estiver ligado na UI
                        if (isMetronomeOn && audioCtx) {
                            // Identifica se é o tempo forte através da velocity
                            playClickAudio(audioCtx.currentTime, n.velocity >= 90);
                        }
                    } else {
                        // Toca a melodia
                        if (currentProgram !== n.program) {
                            currentProgram = n.program;
                            document.getElementById('instrument-select').value = n.program;
                            changeProgram(n.program);
                        }
                        playNote(n.pitch, true);
                    }
                }, playTime * 1000);

                let t2 = setTimeout(() => {
                    if (!n.isMetronome) {
                        stopNote(n.pitch, true);
                    }
                }, endTime * 1000);

                playbackTimers.push(t1, t2);
            });

            playbackTimers.push(setTimeout(() => {
                isPlaying = false;
                updateRecorderUI();
            }, maxDuration * 1000 + 500));
        });

        function stopPlayback() {
            playbackTimers.forEach(clearTimeout);
            playbackTimers = [];
            isPlaying = false;
            document.querySelectorAll('.key.active').forEach(k => {
                stopNote(parseInt(k.dataset.note), true);
            });
            updateRecorderUI();
        }

        btnStop.addEventListener('click', () => {
            if (isRecording) btnRecord.click();
            if (isPlaying) stopPlayback();
        });

        // Exportação Real de Arquivo MIDI (Com Lógica Composta)
        btnExport.addEventListener('click', async () => {
            if (recordedNotes.length === 0) return;
            
            exportTextEl.textContent = 'Gerando...';
            btnExport.disabled = true;

            try {
                let songTitle = document.getElementById('song-title').value.trim();
                let composerName = document.getElementById('composer-name').value.trim();
                
                if (!songTitle) songTitle = "Gravacao_Pastel";
                if (!composerName) composerName = "Artista";
                
                const safeTitle = songTitle.replace(/[^a-zA-Z0-9_\u00C0-\u00FF \-]/g, '_');
                const safeName = composerName.replace(/[^a-zA-Z0-9_\u00C0-\u00FF \-]/g, '_');

                const MidiWriter = window.MidiWriter;
                
                const trackMelody = new MidiWriter.Track();
                const trackMetronome = new MidiWriter.Track();
                
                const isCompound = (timeSignature[0] === 6 && timeSignature[1] === 8);
                
                // Em MIDI, o tempo é medido em Semínimas (Quarter Notes) por Minuto.
                // Se estamos em 6/8, o BPM do usuário refere-se à Semínima Pontuada (que equivale a 1.5 semínimas).
                // Multiplicamos o BPM por 1.5 para dar à DAW a velocidade rítmica real.
                const midiBpm = isCompound ? bpm * 1.5 : bpm;
                
                trackMelody.setTempo(midiBpm);
                trackMelody.setTimeSignature(timeSignature[0], timeSignature[1]);

                const ticksPerBeat = 128; // Ticks por semínima (Quarter note)
                const ticksPerSecond = (midiBpm / 60) * ticksPerBeat; 

                // Ancoragem
                trackMelody.addEvent(new MidiWriter.NoteEvent({
                    pitch: [12], duration: 'T1', startTick: 0, velocity: 0, channel: 1
                }));
                trackMetronome.addEvent(new MidiWriter.NoteEvent({
                    pitch: [12], duration: 'T1', startTick: 0, velocity: 0, channel: 10
                }));

                // Usa as notas processadas pela quantização!
                const notesToExport = getQuantizedNotes();
                const sortedNotes = [...notesToExport].sort((a,b) => a.start - b.start);
                
                sortedNotes.forEach(n => {
                    const startTick = Math.round(n.start * ticksPerSecond);
                    let durTick = Math.round(n.duration * ticksPerSecond);
                    
                    if (isNaN(durTick) || durTick <= 0) durTick = 1;
                    
                    if (n.isMetronome) {
                        trackMetronome.addEvent(new MidiWriter.NoteEvent({
                            pitch: [n.pitch],
                            duration: 'T' + durTick,
                            startTick: startTick,
                            velocity: n.velocity || 100,
                            channel: 10 
                        }));
                    } else {
                        trackMelody.addEvent(new MidiWriter.NoteEvent({
                            pitch: [n.pitch],
                            duration: 'T' + durTick,
                            startTick: startTick,
                            velocity: n.velocity || 100,
                            channel: 1
                        }));
                    }
                });

                const write = new MidiWriter.Writer([trackMelody, trackMetronome]);
                const dataUri = write.dataUri();

                const link = document.createElement('a');
                link.href = dataUri;
                link.download = `${safeTitle.replace(/ /g, '_')}_por_${safeName.replace(/ /g, '_')}.mid`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } catch (err) {
                console.error("Erro ao processar as notas para MIDI: ", err);
                alert("Ocorreu um erro ao gerar as faixas do ficheiro MIDI. Verifique a sua ligação e tente novamente.");
            } finally {
                exportTextEl.textContent = '⬇ Baixar .MID';
                updateRecorderUI();
                btnExport.disabled = false;
            }
        });

        // --- INICIALIZAÇÃO DA INTERFACE ---
        const selectInstrument = document.getElementById('instrument-select');
        function updateInstrumentList() {
            selectInstrument.innerHTML = '';
            gmInstruments.forEach((inst, index) => {
                const opt = document.createElement('option');
                opt.value = index; 
                opt.text = `${String(index + 1).padStart(3, '0')} - ${inst}`;
                selectInstrument.appendChild(opt);
            });
            currentProgram = 0; 
        }
        updateInstrumentList();

        selectInstrument.addEventListener('change', (e) => {
            currentProgram = parseInt(e.target.value);
            changeProgram(currentProgram);
        });

        function getKeyLabel(note) {
            const baseNote = (currentOctave + 1) * 12;
            for (const [key, offset] of Object.entries(keyMap)) {
                if (baseNote + offset === note) {
                    return key.replace('Key', '').replace('Digit', '').replace('Comma', ',').replace('Period', '.').replace('Slash','/').replace('Semicolon',';');
                }
            }
            return '';
        }

        const pianoContainer = document.getElementById('piano');
        let pianoHTML = '';
        for (let i = startNote; i <= endNote; i++) {
            const isBlack = [1, 3, 6, 8, 10].includes(i % 12);
            if (!isBlack) {
                const nextIsBlack = [1, 3, 6, 8, 10].includes((i + 1) % 12);
                let blackHTML = '';
                if (nextIsBlack && (i + 1) <= endNote) {
                     blackHTML = `<div class="key black" data-note="${i+1}"></div>`;
                }
                pianoHTML += `
                    <div class="relative flex-none">
                        <div class="key white" data-note="${i}"><span class="absolute bottom-6 w-full text-center text-[10px] pointer-events-none text-black font-black opacity-30"></span></div>
                        ${blackHTML}
                    </div>
                `;
            }
        }
        pianoContainer.innerHTML = pianoHTML;

        function updateLabels() {
            document.querySelectorAll('.key').forEach(keyEl => {
                const note = parseInt(keyEl.dataset.note);
                const label = getKeyLabel(note);
                const span = keyEl.querySelector('span');
                if (span) span.textContent = label;
            });
            document.getElementById('oct-display').textContent = currentOctave;
        }
        updateLabels();

        setTimeout(() => {
            const middleC = document.querySelector('.key[data-note="60"]');
            if (middleC) middleC.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        }, 300);

        document.getElementById('oct-up').addEventListener('click', () => { if (currentOctave < 7) { currentOctave++; updateLabels(); } });
        document.getElementById('oct-down').addEventListener('click', () => { if (currentOctave > 1) { currentOctave--; updateLabels(); } });


        // --- ÁUDIO E WEB MIDI ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = AudioContext ? new AudioContext() : null;
        let sfInstrument = null;
        let activeSfNotes = {};

        async function loadSoundfont(progNum) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') {
                try { await audioCtx.resume(); } catch(e) {}
            }
            setStatus(`Baixando: ${gmInstruments[progNum]}...`, 'loading');
            try {
                const instName = sfNames[progNum] || "acoustic_grand_piano";
                sfInstrument = await Soundfont.instrument(audioCtx, instName, {
                    nameToUrl: (name, sf, format) => `soundfonts/MusyngKite/${name}-${format}.js`
                });
                setStatus('Pronto para tocar', 'ok');
            } catch (e) {
                console.error(e);
                setStatus('Erro ao carregar', 'error');
            }
        }

        function playAudioSynth(note) {
            if (!audioCtx || !sfInstrument) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (activeSfNotes[note]) return; 
            activeSfNotes[note] = sfInstrument.play(note, audioCtx.currentTime, { gain: 1.5 });
        }

        function stopAudioSynth(note) {
            if (activeSfNotes[note]) {
                activeSfNotes[note].stop(audioCtx.currentTime + 0.1); 
                delete activeSfNotes[note];
            }
        }

        function setStatus(msg, state) {
            document.getElementById('status-text').textContent = msg;
            const dot = document.getElementById('status-dot');
            dot.style.backgroundColor = state === 'ok' ? '#BCDFB9' : state === 'error' ? '#C87F8B' : '#E9A97F';
            
            if(state !== 'ok' && state !== 'error'){
                dot.classList.add('animate-pulse');
            } else {
                dot.classList.remove('animate-pulse');
            }
        }

        function updateDevices() {
            const selectIn = document.getElementById('midi-in-select');
            selectIn.innerHTML = '<option value="">Nenhum / Apenas QWERTY</option>';
            let foundIn = false;
            for (let input of midiAccess.inputs.values()) {
                const opt = document.createElement('option');
                opt.value = input.id; opt.text = input.name; selectIn.appendChild(opt);
                if (!foundIn) { foundIn = true; opt.selected = true; inputPort = input; inputPort.onmidimessage = onMidiMessage; }
            }
            if (!foundIn) inputPort = null;

            const selectOut = document.getElementById('midi-out-select');
            selectOut.innerHTML = '<option value="web-synth">Sintetizador Web (Padrão)</option>';
            for (let output of midiAccess.outputs.values()) {
                const opt = document.createElement('option');
                opt.value = output.id; opt.text = output.name; selectOut.appendChild(opt);
            }
            if (!outputPort) {
                loadSoundfont(currentProgram);
            } else {
                setStatus('MIDI Ativo', 'ok');
            }
        }

        function onMidiMessage(msg) {
            const [status, note, velocity] = msg.data;
            const cmd = status >> 4;
            if (cmd === 9 && velocity > 0) playNote(note);
            else if (cmd === 8 || (cmd === 9 && velocity === 0)) stopNote(note);
        }

        async function initMIDI() {
            if (navigator.requestMIDIAccess) {
                try {
                    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                    updateDevices();
                    midiAccess.onstatechange = updateDevices;
                } catch (err) {
                    setStatus('Sem permissão MIDI', 'error');
                    loadSoundfont(currentProgram);
                }
            } else {
                setStatus('Web MIDI não suportada', 'error');
                loadSoundfont(currentProgram);
            }
        }

        document.getElementById('midi-out-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'web-synth') { outputPort = null; loadSoundfont(currentProgram); } 
            else if (midiAccess) { outputPort = midiAccess.outputs.get(val) || null; if (outputPort) changeProgram(currentProgram); }
        });

        document.getElementById('midi-in-select').addEventListener('change', (e) => {
            if (inputPort) inputPort.onmidimessage = null;
            const val = e.target.value;
            inputPort = (val && midiAccess) ? midiAccess.inputs.get(val) : null;
            if (inputPort) inputPort.onmidimessage = onMidiMessage;
        });

        initMIDI();

        // --- INTEGRAÇÃO GRAVADOR + TECLADO ---

        function playNote(note, isPlayback = false) {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (outputPort) outputPort.send([0x90, note, 100]);
            else playAudioSynth(note);
            
            const keyEl = document.querySelector(`.key[data-note="${note}"]`);
            if (keyEl) keyEl.classList.add('active');

            if (isRecording && !isPlayback) {
                const timeNow = audioCtx.currentTime;
                activeRecordingNotes[note] = {
                    pitch: note,
                    start: timeNow - recordStartTime,
                    velocity: 100,
                    channel: currentChannel,
                    program: currentProgram
                };
            }
        }

        function stopNote(note, isPlayback = false) {
            if (outputPort) outputPort.send([0x80, note, 0]);
            else stopAudioSynth(note);
            
            const keyEl = document.querySelector(`.key[data-note="${note}"]`);
            if (keyEl) keyEl.classList.remove('active');

            if (isRecording && !isPlayback && activeRecordingNotes[note]) {
                const timeNow = audioCtx.currentTime;
                let recNote = activeRecordingNotes[note];
                recNote.duration = (timeNow - recordStartTime) - recNote.start;
                
                if (recNote.duration > 0.01) {
                    recordedNotes.push(recNote);
                    updateRecorderUI();
                }
                delete activeRecordingNotes[note];
            }
        }

        function changeProgram(programNumber) {
            if (outputPort) outputPort.send([0xC0, programNumber]);
            else loadSoundfont(programNumber);
        }

        // --- INTERAÇÃO FÍSICA ---
        let isMouseDown = false;
        let currentMouseNote = null;

        pianoContainer.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            const key = e.target.closest('.key');
            if (key) {
                const note = parseInt(key.dataset.note);
                playNote(note);
                currentMouseNote = note;
            }
        });

        pianoContainer.addEventListener('mouseover', (e) => {
            if (!isMouseDown) return;
            const key = e.target.closest('.key');
            if (key) {
                const note = parseInt(key.dataset.note);
                if (note !== currentMouseNote) {
                    if (currentMouseNote !== null) stopNote(currentMouseNote);
                    playNote(note);
                    currentMouseNote = note;
                }
            }
        });

        pianoContainer.addEventListener('mouseout', (e) => {
            if (!isMouseDown) return;
            const key = e.target.closest('.key');
            if (key) {
                const note = parseInt(key.dataset.note);
                if (note === currentMouseNote) {
                    stopNote(note);
                    currentMouseNote = null;
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            if (currentMouseNote !== null) { stopNote(currentMouseNote); currentMouseNote = null; }
        });

        const activePCNotes = new Map();
        window.addEventListener('keydown', (e) => {
            if (e.repeat || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return; 
            const offset = keyMap[e.code];
            if (offset !== undefined) {
                const note = (currentOctave + 1) * 12 + offset;
                if (note >= startNote && note <= endNote) {
                    playNote(note);
                    activePCNotes.set(e.code, note);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (activePCNotes.has(e.code)) {
                stopNote(activePCNotes.get(e.code));
                activePCNotes.delete(e.code);
            }
        });

    </script>
</body>
